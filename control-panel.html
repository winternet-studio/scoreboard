<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Panel</title>
<script src="https://unpkg.com/vue@3"></script>
<script src="config.js"></script>
<script src="control-panel.js" defer></script>
<style>
body {
	margin: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	height: 100vh;
	font-family: Tahoma;
}
.sport-selector {
	position: fixed;
	right: 20px;
	bottom: 20px;
}
#players-container {
	display: flex;
	justify-content: space-around;
	width: 100%;
	max-width: 800px; /* Adjust max-width as needed */
	margin-bottom: 20px;
}
#players-container.reverse-columns {
	flex-direction: row-reverse;
}
#left-player,
#right-player {
	flex-basis: 50%;
}

.pointsinput {
	width: 30px;
	text-align: center;
	border: 0;
}

.player-name {
	margin-top: 20px;
	margin-bottom: 20px;
	text-align: center;
}
.my-turn {
	font-weight: bold;
}

button.inc,
button.dec {
	width: 100%;
}
button.inc {
	height: 100px;
	font-size: 50px;
	font-weight: bold;
}
button.dec {
	height: 30px;
}
</style>
</head>
<body>
	<div id="app">
		<div id="players-container" :class="{ 'reverse-columns': reverseColumns }">
			<div id="left-player">
				<button @click="incrementScore(1)" class="inc">{{ score1 }}</button>
				<div :class="{ 'player-name': true, 'my-turn': playersTurn === 1 }">Player 1</div>
				<button @click="decrementScore(1)" class="dec">-</button>
				<div style="height: 20px"></div>
				<div style="text-align: right;">Sets: <input type="number" v-model="setPoints1" @input="(event) => pointsAdjusted(event, 'setPoints1')" min="0" class="pointsinput"></div>
				<div style="text-align: right;">Matches: <input type="number" v-model="matchPoints1" @input="(event) => pointsAdjusted(event, 'matchPoints1')" min="0" class="pointsinput"></div>
			</div>
			<div id="right-player">
				<button @click="incrementScore(2)" class="inc" :class="{ 'my-turn': playersTurn === 2 }">{{ score2 }}</button>
				<div :class="{ 'player-name': true, 'my-turn': playersTurn === 2 }">Player 2</div>
				<button @click="decrementScore(2)" class="dec">-</button>
				<div style="height: 20px"></div>
				<div style="text-align: right;">Sets: <input type="number" v-model="setPoints2" @input="(event) => pointsAdjusted(event, 'setPoints2')" min="0" class="pointsinput"></div>
				<div style="text-align: right;">Matches: <input type="number" v-model="matchPoints2" @input="(event) => pointsAdjusted(event, 'matchPoints2')" min="0" class="pointsinput"></div>
			</div>
		</div>
		<div>
			<button @click="switchServe">Switch Serve</button>
			&nbsp;
			<button @click="reset">Reset</button>
			&nbsp;
			<button @click="swapSides">Swap Sides</button>
		</div>
		<div v-if="currSport != 'tennis'" style="margin-top: 10px">
			<input type="range" min="1" max="10" v-model="serveCount" @change="changeServeCount" />
			<label>{{ serveCount }} serves each</label>
		</div>
		<div class="sport-selector">
			<select v-model="currSport">
				<option v-for="sport in allSports" :key="sport.id" :value="sport.id">{{ sport.name }}</option>
			</select>
		</div>
	</div>
</body>
</html>
